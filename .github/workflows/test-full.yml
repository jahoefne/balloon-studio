name: Full test tier

# The `full` tier of docs/plan.md WP-V3 in four shards: every Swift sweep with the opt-in suites `outlets` and `clamp`,
# every export assertion, and the whole grid of web/harness. Pull requests run it with the label `full-tests`.
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: references/pack/refs-v2
          key: refs-pack-${{ hashFiles('references/manifest.json') }}
      - run: bash mac/scripts/fetch-pack.sh
        working-directory: .
      - run: npm ci
      # Geometry suites import the core modules directly, so the stub behind #core does not matter to them.
      - run: npx vitest run --maxWorkers=4 --reporter=default --reporter=json --outputFile=test-full-${{ matrix.shard }}.json
        env:
          FULL: 1
          REFS_SHARD: ${{ matrix.shard }}/4
      # What goes through the CoreApi needs the real core: the grid against the Swift references.
      - run: npm run test:reference
        env:
          VITE_CORE: real
          REFS_SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-full-${{ matrix.shard }}
          path: |
            web/test-full-${{ matrix.shard }}.json
            references/report.json
          if-no-files-found: ignore
