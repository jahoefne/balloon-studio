name: Full reference comparison

# The whole grid of web/harness against the Swift references, in four shards. It needs the real
# core: until WP-K9 delivers web/src/core/real/index.ts the gate skips the comparison.
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compare-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-compare')
    runs-on: ubuntu-latest
    outputs:
      real: ${{ steps.core.outputs.real }}
    steps:
      - uses: actions/checkout@v7
      - id: core
        run: |
          if [ -f web/src/core/real/index.ts ]; then echo "real=true" >> "$GITHUB_OUTPUT"; else echo "real=false" >> "$GITHUB_OUTPUT"; fi

  compare:
    needs: gate
    if: needs.gate.outputs.real == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: references/pack/refs-v2
          key: refs-pack-${{ hashFiles('references/manifest.json') }}
      - run: bash mac/scripts/fetch-pack.sh
      - run: npm ci
        working-directory: web
      - run: npm run test:reference
        working-directory: web
        env:
          VITE_CORE: real
          REFS_SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-report-${{ matrix.shard }}
          path: references/report.json
          if-no-files-found: ignore
